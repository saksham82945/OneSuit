name: Frontend Tests

# This workflow used to point at a "frontend-react" directory (and build the Go
# backend from the repo root), neither of which exists, so every run failed.
# The React app lives in frontend/ and its tests are Vitest unit tests, which
# need no backend, database or Redis.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same command Vercel runs (type-check + Vite build).
      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test
